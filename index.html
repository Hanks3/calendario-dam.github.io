<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de exámenes · 2º DAM</title>
<meta name="theme-color" content="#2f6fed">
<meta property="og:type" content="website">
<meta property="og:title" content="📅 Calendario de exámenes · 2º DAM">
<meta property="og:description" content="Consulta las próximas fechas de exámenes y entregas de IPE II, SGE, DI, AD, PSP, OP y MO.">
<meta property="og:url" content="https://hanks3.github.io/calendario-dam.github.io/">
<meta property="og:image" content="https://hanks3.github.io/calendario-dam.github.io/preview.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#6b7078;--bd:#e3e1da;--ipe:#2f6fed;--sge:#16a085;--di:#d9822b;--today:#ffe9a8;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--card:#20242a;--tx:#eceef1;--mut:#9aa1ab;--bd:#323840;--ipe:#6f9cff;--sge:#4fd1b5;--di:#f0a45a;--today:#5a4a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181c;--card:#20242a;--tx:#eceef1;--mut:#9aa1ab;--bd:#323840;--ipe:#6f9cff;--sge:#4fd1b5;--di:#f0a45a;--today:#5a4a14;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:1.5fr 1fr}}
h1{font-size:20px;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.head h2{font-size:17px;margin:0;text-transform:capitalize}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.p{background:var(--ipe);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mut);text-align:center;padding:2px 0}
.day{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:3px;font-size:12px;overflow:hidden}
.day.off{opacity:.35}
.day.today{background:var(--today)}
.day b{font-weight:600}
.chip{display:block;margin-top:2px;padding:1px 4px;border-radius:4px;color:#fff;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-IPE{background:var(--ipe)}.s-SGE{background:var(--sge)}.s-DI{background:var(--di)}.s-Otra{background:#8a63d2}
.s-AD{background:#c0392b}.s-PSP{background:#b83280}.s-OP{background:#5b6b7c}.s-MO{background:#0e7490}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
li.past{opacity:.5}
.bar{width:5px;align-self:stretch;border-radius:3px}
li .t{flex:1;min-width:0}
li .t div:first-child{font-weight:600}
li .m{font-size:12px;color:var(--mut)}
.cd{font-size:12px;font-weight:600;white-space:nowrap}
.x{padding:2px 7px}
[hidden]{display:none!important}
form{display:grid;gap:8px;margin-top:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{display:flex;gap:8px;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<main>
<section class="card">
  <h1>Calendario de exámenes</h1>
  <div class="head">
    <button id="prev" aria-label="Mes anterior">←</button>
    <h2 id="title"></h2>
    <button id="next" aria-label="Mes siguiente">→</button>
  </div>
  <div class="grid" id="cal"></div>
  <div class="legend">
    <span><i class="s-IPE"></i>IPE II</span>
    <span><i class="s-SGE"></i>Sist. gestión empresarial</span>
    <span><i class="s-DI"></i>Desarrollo de Interfaces</span>
    <span><i class="s-AD"></i>Acceso a Datos</span>
    <span><i class="s-PSP"></i>Prog. servicios y procesos</span>
    <span><i class="s-OP"></i>Optativa</span>
    <span><i class="s-MO"></i>Prog. multimedia y móviles</span>
    <span><i class="s-Otra"></i>Otra</span>
  </div>
</section>
<section class="card">
  <div class="head"><h2>Próximas fechas</h2><button id="today">Hoy</button></div>
  <ul id="list"></ul>
  <form id="f">
    <b id="ft">Añadir fecha (la verán todos)</b>
    <input id="n" placeholder="Ej.: Examen Unidad 4" required>
    <div class="row">
      <select id="s">
        <option value="IPE">IPE II</option>
        <option value="SGE">Sist. gestión empresarial</option>
        <option value="DI">Desarrollo de Interfaces</option>
        <option value="AD">Acceso a Datos</option>
        <option value="PSP">Prog. servicios y procesos</option>
        <option value="OP">Optativa</option>
        <option value="MO">Prog. multimedia y móviles</option>
        <option value="Otra">Otra</option>
      </select>
      <input id="d" type="date" required>
    </div>
    <button class="p" type="submit" id="ok">Añadir</button>
    <button type="button" id="cancel" hidden>Cancelar edición</button>
  </form>
  <div class="foot"><span id="cnt"></span><button id="reset">Actualizar</button></div>
</section>
</main>
<script>
// 1) Pega aquí la URL de tu Firebase Realtime Database (sin barra final)
var DB="https://calendario-segundo-dam-default-rtdb.europe-west1.firebasedatabase.app";

var NAMES={IPE:"IPE II",SGE:"Sist. gestión empresarial",DI:"Desarrollo de Interfaces",AD:"Acceso a Datos",PSP:"Prog. servicios y procesos",OP:"Optativa",MO:"Prog. multimedia y móviles",Otra:"Otra"};
var SHORT={IPE:"IPE",SGE:"SGE",DI:"DI",AD:"AD",PSP:"PSP",OP:"OP",MO:"MO",Otra:"Otra"};
var CONF=DB.indexOf("TU-PROYECTO")<0, shared=[], editing=null, err=false;

function norm(data){
  var out=[];if(!data)return out;
  for(var k in data){var e=data[k];if(e&&e.n&&e.s&&e.d)out.push({id:k,n:e.n,s:e.s,d:e.d})}
  return out;
}
function seed(){
  return fetch("exams.json").then(function(r){return r.json()}).then(function(arr){
    if(!CONF){shared=norm(arr);return}
    return fetch(DB+"/exams.json",{method:"PUT",body:JSON.stringify(arr)})
      .then(function(){return fetch(DB+"/exams.json")}).then(function(r){return r.json()})
      .then(function(d){shared=norm(d)});
  });
}
function loadShared(){
  if(!CONF){return seed().catch(function(){err=true})}
  return fetch(DB+"/exams.json").then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){err=false;if(d===null)return seed();shared=norm(d)})
    .catch(function(){err=true});
}
function api(method,id,body){
  if(!CONF){alert("Falta configurar la URL de Firebase en index.html");return Promise.resolve()}
  var url=DB+"/exams"+(id?"/"+id:"")+".json";
  return fetch(url,{method:method,body:body?JSON.stringify(body):undefined})
    .then(function(r){if(!r.ok)throw 0})
    .catch(function(){alert("No se pudo guardar. Inténtalo de nuevo.")})
    .then(loadShared).then(render);
}

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var now=new Date(),todayIso=iso(now),view=new Date(now.getFullYear(),now.getMonth(),1);
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}
function diff(s){var p=s.split("-"),a=new Date(+p[0],+p[1]-1,+p[2]),b=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((a-b)/864e5)}
function $(i){return document.getElementById(i)}

function render(){
  var ev=shared;
  $("title").textContent=view.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
  var h="";["L","M","X","J","V","S","D"].forEach(function(x){h+='<div class="dow">'+x+'</div>'});
  var first=new Date(view.getFullYear(),view.getMonth(),1),off=(first.getDay()+6)%7,start=new Date(first);start.setDate(1-off);
  for(var i=0;i<42;i++){
    var c=new Date(start);c.setDate(start.getDate()+i);var k=iso(c);
    var cls="day"+(c.getMonth()!==view.getMonth()?" off":"")+(k===todayIso?" today":"");
    h+='<div class="'+cls+'"><b>'+c.getDate()+'</b>';
    ev.forEach(function(e){if(e.d===k)h+='<span class="chip s-'+e.s+'" title="'+esc(NAMES[e.s]+": "+e.n)+'">'+esc(SHORT[e.s]+" · "+e.n)+'</span>'});
    h+='</div>';
  }
  $("cal").innerHTML=h;

  var sorted=ev.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var up=sorted.filter(function(e){return diff(e.d)>=0});
  var past=sorted.filter(function(e){return diff(e.d)<0}).reverse().slice(0,3);
  var l="";
  up.concat(past).forEach(function(e){
    var dd=diff(e.d),t=dd<0?"pasado":dd===0?"¡Hoy!":dd===1?"mañana":"en "+dd+" días";
    l+='<li class="'+(dd<0?"past":"")+'"><span class="bar s-'+e.s+'"></span><div class="t"><div>'+esc(e.n)+'</div><div class="m">'+esc(NAMES[e.s])+' · '+fmt(e.d)+'</div></div><span class="cd">'+t+'</span>'
      +'<button class="x" data-a="edit" data-id="'+esc(e.id)+'" aria-label="Editar">✎</button>'
      +'<button class="x" data-a="del" data-id="'+esc(e.id)+'" aria-label="Eliminar">×</button></li>';
  });
  $("list").innerHTML=l||"<li>No hay fechas.</li>";
  $("cnt").textContent=up.length+" pendientes"+(err?" · sin conexión con la base de datos":"")+(CONF?"":" · modo solo lectura");
}

function stopEdit(){editing=null;$("f").reset();$("ok").textContent="Añadir";$("ft").textContent="Añadir fecha (la verán todos)";$("cancel").hidden=true}

$("prev").onclick=function(){view.setMonth(view.getMonth()-1);render()};
$("next").onclick=function(){view.setMonth(view.getMonth()+1);render()};
$("today").onclick=function(){view=new Date(now.getFullYear(),now.getMonth(),1);render()};
$("reset").onclick=function(){loadShared().then(render)};
$("cancel").onclick=stopEdit;
$("list").onclick=function(e){
  var a=e.target.getAttribute("data-a"),id=e.target.getAttribute("data-id");
  if(!a)return;
  if(a==="del"){if(confirm("¿Borrar esta fecha para todos los compañeros?"))api("DELETE",id)}
  if(a==="edit"){
    var x=shared.filter(function(s){return s.id===id})[0];if(!x)return;
    editing=id;$("n").value=x.n;$("s").value=x.s;$("d").value=x.d;
    $("ok").textContent="Guardar cambios";$("ft").textContent="Editar fecha (el cambio lo verán todos)";$("cancel").hidden=false;
    $("n").focus();
  }
};
$("f").onsubmit=function(e){
  e.preventDefault();
  var ev={n:$("n").value.trim(),s:$("s").value,d:$("d").value};
  var p=ev.d.split("-");view=new Date(+p[0],+p[1]-1,1);
  var id=editing;stopEdit();
  if(id)api("PUT",id,ev);else api("POST",null,ev);
};

render();
loadShared().then(render);
setInterval(function(){loadShared().then(render)},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)loadShared().then(render)});
</script>
</body>
</html>
